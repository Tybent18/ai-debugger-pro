name: Generate product demos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: python -m pip install -e ".[demo]"
      - run: xvfb-run --auto-servernum python tools/generate_demos.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-debugger-pro-demos
          path: |
            assets/demo.gif
            assets/demos/*.gif
