<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Failure evidence coverage</title><desc id="d">Fourteen of sixteen failure cases had nonempty evidence, or 87.5 percent.</desc><rect width="900" height="500" fill="#f8fafc"/><text x="60" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Failure evidence coverage</text><text x="60" y="84" font-family="Arial" font-size="16" fill="#475569">16 observed failures across Python, C, C++, and Java</text><rect x="90" y="170" width="720" height="95" rx="12" fill="#e2e8f0"/><rect x="90" y="170" width="630" height="95" rx="12" fill="#22c55e"/><rect x="720" y="170" width="90" height="95" fill="#ef4444"/><text x="365" y="228" font-family="Arial" font-size="25" font-weight="700" text-anchor="middle" fill="#052e16">14 nonempty</text><text x="765" y="228" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="white">2 empty</text><text x="450" y="335" font-family="Arial" font-size="48" font-weight="700" text-anchor="middle" fill="#0f172a">87.5%</text><text x="450" y="370" font-family="Arial" font-size="18" text-anchor="middle" fill="#475569">diagnostic-evidence coverage</text></svg>