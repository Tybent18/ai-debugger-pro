<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="t d"><title id="t">Context source risk and utility</title><desc id="d">A proposed matrix mapping diagnostic utility against privacy and injection risk.</desc><rect width="900" height="650" fill="#f8fafc"/><text x="55" y="50" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Context source risk and utility</text><rect x="145" y="110" width="300" height="220" fill="#dcfce7"/><rect x="445" y="110" width="300" height="220" fill="#fef3c7"/><rect x="145" y="330" width="300" height="220" fill="#e0f2fe"/><rect x="445" y="330" width="300" height="220" fill="#fee2e2"/><g font-family="Arial" font-size="19" font-weight="700" fill="#0f172a"><text x="170" y="145">Include automatically</text><text x="470" y="145">Redact / approve</text><text x="170" y="365">Optional or exclude</text><text x="470" y="365">Exclude</text></g><g font-family="Arial" font-size="16" fill="#334155"><text x="170" y="190">Return code and phase</text><text x="170" y="220">Compiler location</text><text x="170" y="250">Focal source</text><text x="470" y="190">Bounded locals</text><text x="470" y="220">Related configuration</text><text x="470" y="250">External issue text</text><text x="170" y="410">General documentation</text><text x="170" y="440">Distant source files</text><text x="470" y="410">Secrets and credentials</text><text x="470" y="440">Full environment dumps</text><text x="470" y="470">Generated caches</text></g><text x="390" y="610" font-family="Arial" font-size="17" fill="#475569">Risk increases →</text><text transform="translate(55 420) rotate(-90)" font-family="Arial" font-size="17" fill="#475569">Diagnostic utility increases →</text></svg>