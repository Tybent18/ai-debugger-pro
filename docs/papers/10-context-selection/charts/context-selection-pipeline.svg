<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Context selection pipeline</title><desc id="d">Failure evidence is normalized, candidates are generated, risks are filtered, evidence is ranked, budgeted, reviewed, and serialized.</desc><rect width="1000" height="560" fill="#f8fafc"/><text x="55" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Governed context-selection pipeline</text><g font-family="Arial" text-anchor="middle"><g fill="#0f172a"><rect x="65" y="120" width="250" height="80" rx="12"/><rect x="375" y="120" width="250" height="80" rx="12"/><rect x="685" y="120" width="250" height="80" rx="12"/></g><g fill="#0284c7"><rect x="65" y="285" width="250" height="80" rx="12"/><rect x="375" y="285" width="250" height="80" rx="12"/><rect x="685" y="285" width="250" height="80" rx="12"/></g><g fill="white" font-size="20" font-weight="700"><text x="190" y="167">1. Normalize evidence</text><text x="500" y="167">2. Generate candidates</text><text x="810" y="167">3. Filter risk</text><text x="190" y="332">4. Rank relevance</text><text x="500" y="332">5. Allocate budget</text><text x="810" y="332">6. Review and bind</text></g><g stroke="#64748b" stroke-width="5" fill="none"><path d="M315 160 H365"/><path d="M625 160 H675"/><path d="M810 200 V265"/><path d="M685 325 H635"/><path d="M375 325 H325"/></g><text x="500" y="465" font-size="22" font-weight="700" fill="#0f172a">Output: immutable context manifest with provenance</text><text x="500" y="500" font-size="17" fill="#475569">Missing, stale, or contradictory evidence produces an explicit insufficiency state.</text></g></svg>