<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="t d"><title id="t">Regression test admission pipeline</title><desc id="d">A proposed test is parsed, bound to intent, checked on bad and candidate versions, challenged with mutants, checked for noninterference, and admitted with scoped authority.</desc><rect width="1000" height="590" fill="#f8fafc"/><text x="55" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Regression-test admission pipeline</text><g font-family="Arial" text-anchor="middle" font-size="19" font-weight="700" fill="white"><rect x="55" y="125" width="260" height="75" rx="12" fill="#0f172a"/><text x="185" y="170">1. Parse and isolate</text><rect x="370" y="125" width="260" height="75" rx="12" fill="#0f172a"/><text x="500" y="170">2. Bind to intent</text><rect x="685" y="125" width="260" height="75" rx="12" fill="#0f172a"/><text x="815" y="170">3. Fail bad / pass fix</text><rect x="55" y="300" width="260" height="75" rx="12" fill="#0284c7"/><text x="185" y="345">4. Challenge mutants</text><rect x="370" y="300" width="260" height="75" rx="12" fill="#0284c7"/><text x="500" y="345">5. Check interference</text><rect x="685" y="300" width="260" height="75" rx="12" fill="#16a34a"/><text x="815" y="345">6. Admit with scope</text></g><g stroke="#64748b" stroke-width="5"><path d="M315 162 H360"/><path d="M630 162 H675"/><path d="M815 200 V280"/><path d="M685 337 H640"/><path d="M370 337 H325"/></g><text x="500" y="480" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Reject, revise, quarantine, admit, or request clarification</text><text x="500" y="515" font-family="Arial" font-size="17" text-anchor="middle" fill="#475569">No generated test becomes authoritative merely because it is green.</text></svg>