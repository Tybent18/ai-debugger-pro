<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">Oracle independence ladder</title><desc id="d">Authority rises from candidate rerun through generated tests, repository tests, hidden tests, properties, and human-adjudicated requirements.</desc><rect width="1000" height="610" fill="#f8fafc"/><text x="55" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Oracle independence ladder</text><text x="55" y="88" font-family="Arial" font-size="17" fill="#475569">Greater independence can support stronger verification claims</text><g font-family="Arial" font-size="18" font-weight="700"><rect x="80" y="470" width="250" height="55" fill="#bae6fd"/><text x="100" y="504" fill="#0f172a">O0 Candidate rerun</text><rect x="150" y="405" width="300" height="55" fill="#7dd3fc"/><text x="170" y="439" fill="#0f172a">O1-O2 Generated tests</text><rect x="220" y="340" width="350" height="55" fill="#38bdf8"/><text x="240" y="374" fill="#082f49">O3 Specification-derived</text><rect x="290" y="275" width="400" height="55" fill="#22c55e"/><text x="310" y="309" fill="#052e16">O4 Repository-owned</text><rect x="360" y="210" width="450" height="55" fill="#16a34a"/><text x="380" y="244" fill="white">O5 Hidden independent tests</text><rect x="430" y="145" width="490" height="55" fill="#0f766e"/><text x="450" y="179" fill="white">O6-O10 Properties / formal / human</text></g><text x="805" y="565" font-family="Arial" font-size="17" fill="#475569">Authority and independence rise →</text></svg>