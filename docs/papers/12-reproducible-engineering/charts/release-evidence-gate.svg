<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Release evidence gate</title><desc id="d">Ten checks connect source, tests, builds, frozen inputs, raw data, claims, publications, checksums, and disclosures.</desc><rect width="1000" height="620" fill="#f8fafc"/><text x="55" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Release evidence gate</text><g font-family="Arial" font-size="17" font-weight="700" fill="#0f172a"><text x="70" y="140">1 Source identified</text><text x="70" y="205">2 Tests and lint</text><text x="70" y="270">3 Builds bound</text><text x="70" y="335">4 Environment captured</text><text x="70" y="400">5 Inputs frozen</text><text x="530" y="140">6 Raw data retained</text><text x="530" y="205">7 Claims reviewed</text><text x="530" y="270">8 Papers and links</text><text x="530" y="335">9 Checksums published</text><text x="530" y="400">10 Limits disclosed</text></g><g fill="#22c55e"><circle cx="45" cy="134" r="12"/><circle cx="45" cy="199" r="12"/><circle cx="45" cy="264" r="12"/><circle cx="45" cy="329" r="12"/><circle cx="45" cy="394" r="12"/><circle cx="505" cy="134" r="12"/><circle cx="505" cy="199" r="12"/><circle cx="505" cy="264" r="12"/><circle cx="505" cy="329" r="12"/><circle cx="505" cy="394" r="12"/></g><rect x="250" y="480" width="500" height="70" rx="14" fill="#0f172a"/><text x="500" y="523" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle" fill="white">Publish with scoped evidence and provenance</text></svg>