<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Reproducible evidence graph</title><desc id="d">Source and environment produce runs, raw data, derived figures, claims, releases, and replication records.</desc><rect width="1000" height="650" fill="#f8fafc"/><text x="55" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Reproducible evidence graph</text><g font-family="Arial" text-anchor="middle" font-size="18" font-weight="700" fill="white"><rect x="70" y="120" width="230" height="70" rx="12" fill="#0f172a"/><text x="185" y="162">Source commit</text><rect x="385" y="120" width="230" height="70" rx="12" fill="#0f172a"/><text x="500" y="162">Environment</text><rect x="700" y="120" width="230" height="70" rx="12" fill="#0f172a"/><text x="815" y="162">Frozen manifests</text><rect x="220" y="280" width="230" height="70" rx="12" fill="#0284c7"/><text x="335" y="322">Raw observations</text><rect x="550" y="280" width="230" height="70" rx="12" fill="#0284c7"/><text x="665" y="322">Derivations</text><rect x="70" y="455" width="230" height="70" rx="12" fill="#16a34a"/><text x="185" y="497">Published claims</text><rect x="385" y="455" width="230" height="70" rx="12" fill="#16a34a"/><text x="500" y="497">Release artifacts</text><rect x="700" y="455" width="230" height="70" rx="12" fill="#0f766e"/><text x="815" y="497">Replication record</text></g><g stroke="#64748b" stroke-width="4" fill="none"><path d="M185 190 L300 270"/><path d="M500 190 L390 270"/><path d="M815 190 L720 270"/><path d="M450 315 H540"/><path d="M665 350 L520 445"/><path d="M335 350 L210 445"/><path d="M615 490 H690"/></g><text x="500" y="590" font-family="Arial" font-size="17" text-anchor="middle" fill="#475569">Every edge records inputs, transformation, identity, and validation state.</text></svg>