<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Reproducibility levels</title><desc id="d">Six levels from described to auditable release.</desc><rect width="1000" height="620" fill="#f8fafc"/><text x="55" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Reproducibility levels</text><g font-family="Arial" font-size="18" font-weight="700"><rect x="75" y="490" width="210" height="50" fill="#dbeafe"/><text x="95" y="521" fill="#0f172a">R0 Described</text><rect x="145" y="420" width="250" height="50" fill="#bae6fd"/><text x="165" y="451" fill="#0f172a">R1 Inspectable</text><rect x="215" y="350" width="290" height="50" fill="#7dd3fc"/><text x="235" y="381" fill="#0f172a">R2 Repeatable</text><rect x="285" y="280" width="330" height="50" fill="#38bdf8"/><text x="305" y="311" fill="#082f49">R3 Reproducible</text><rect x="355" y="210" width="370" height="50" fill="#22c55e"/><text x="375" y="241" fill="#052e16">R4 Independently replicated</text><rect x="425" y="140" width="420" height="50" fill="#0f766e"/><text x="445" y="171" fill="white">R5 Auditable release evidence</text></g><text x="720" y="575" font-family="Arial" font-size="17" fill="#475569">Independent confidence rises →</text></svg>